<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Arcships Sandbox Runner</title>
  <desc id="desc">Local commands with explicit permissions. A standalone JSON runner for macOS, Linux, and Windows.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101f30"/>
      <stop offset="1" stop-color="#08121d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#92f4dc"/>
      <stop offset="1" stop-color="#67cde9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#86a9c2" stroke-opacity=".065"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="358" rx="22" fill="url(#background)" stroke="#263b4e"/>
  <rect x="1" y="1" width="1278" height="358" rx="22" fill="url(#grid)"/>
  <path d="M65 59h20m-10-10v20" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="100" y="64" fill="#88ddcf" font-size="12" font-weight="600" letter-spacing="2.8">LOCAL PROCESS ISOLATION</text>
    <text x="64" y="137" fill="#eef5fb" font-size="52" font-weight="700" letter-spacing="-1.5">Arcships</text>
    <text x="64" y="198" fill="#eef5fb" font-size="52" font-weight="700" letter-spacing="-1.5">Sandbox Runner</text>
    <text x="66" y="239" fill="#a4bbce" font-size="20">Local commands. Explicit permissions.</text>
    <rect x="64" y="276" width="92" height="29" rx="7" fill="#12343c" stroke="#295963"/>
    <text x="82" y="295" fill="#9cf0df" font-size="12" font-weight="600">JSON v1</text>
    <text x="173" y="295" fill="#829db4" font-size="13">One binary interface. Your application.</text>
    <path d="m641 167 13 13-13 13m-14-26 13 13-13 13" fill="none" stroke="#5bbcad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="716" y="63" width="500" height="249" rx="18" fill="#0a1723" fill-opacity=".7" stroke="#3d726f" stroke-dasharray="5 6"/>
    <text x="741" y="87" fill="#81adae" font-size="10" font-weight="600" letter-spacing="2">LOCAL RUNTIME</text>
    <rect x="744" y="105" width="444" height="152" rx="12" fill="#0b1520" stroke="#2c455b"/>
    <path d="M745 143h442" stroke="#23384c"/>
    <circle cx="763" cy="125" r="4" fill="#e88683"/>
    <circle cx="778" cy="125" r="4" fill="#e9c67c"/>
    <circle cx="793" cy="125" r="4" fill="#88cfa9"/>
    <text x="821" y="129" fill="#8ca8be" font-size="12" font-family="'SFMono-Regular', Consolas, monospace">dim-sandbox-runner</text>
    <g font-family="'SFMono-Regular', Consolas, monospace">
      <text x="768" y="178" fill="#91ead5" font-size="16">&gt; run(request)</text>
      <text x="768" y="207" fill="#91aabe" font-size="13">workspace-write  /  network: []</text>
      <text x="768" y="235" fill="#d9e7f2" font-size="13">{ "exitCode": 0 }</text>
    </g>
    <g font-size="11" font-weight="600" text-anchor="middle">
      <rect x="769" y="273" width="115" height="24" rx="6" fill="#142b39" stroke="#284758"/>
      <rect x="906" y="273" width="115" height="24" rx="6" fill="#142b39" stroke="#284758"/>
      <rect x="1043" y="273" width="115" height="24" rx="6" fill="#142b39" stroke="#284758"/>
      <text x="826.5" y="289" fill="#adcedb">macOS</text>
      <text x="963.5" y="289" fill="#adcedb">Linux</text>
      <text x="1100.5" y="289" fill="#adcedb">Windows</text>
    </g>
    <circle cx="1188" cy="65" r="21" fill="#15333b" stroke="#5eb8ac"/>
    <path d="M1181 64v-4a7 7 0 0 1 14 0v4m-17 0h20v13h-20z" fill="none" stroke="#a2eddb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
