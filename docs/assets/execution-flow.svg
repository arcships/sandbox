<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="280" viewBox="0 0 1240 280" role="img" aria-labelledby="title desc">
  <title id="title">Sandbox runner execution flow</title>
  <desc id="desc">A trusted application sends one JSON request and closes stdin. The runner applies a platform sandbox to the command and its children, then returns one JSON result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l8 4-8 4" fill="none" stroke="#8fb9bf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1238" height="278" rx="16" fill="#0d1825" stroke="#2d4255"/>
  <g fill="none" stroke="#8fb9bf" stroke-width="2" marker-end="url(#arrow)">
    <path d="M260 116h74"/>
    <path d="M592 116h82"/>
    <path d="M900 116h84"/>
    <path d="M466 167v59H150v-53"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <g fill="#9eb9cd" font-size="14">
      <text x="299" y="91">JSON + EOF</text>
      <text x="634" y="91">policy</text>
      <text x="943" y="91">launch</text>
      <text x="308" y="251">JSON result on stdout</text>
    </g>
    <rect x="40" y="66" width="220" height="100" rx="12" fill="#182b3d" stroke="#4c6d88"/>
    <text x="150" y="96" fill="#92b4ce" font-size="12" font-weight="600" letter-spacing="1.7">TRUSTED HOST</text>
    <text x="150" y="132" fill="#e3edf8" font-size="20" font-weight="600">Your application</text>
    <rect x="340" y="66" width="252" height="100" rx="12" fill="#15362f" stroke="#62bd9e"/>
    <text x="466" y="96" fill="#90d6bd" font-size="12" font-weight="600" letter-spacing="1.7">LOCAL RUNNER</text>
    <text x="466" y="132" fill="#d9f3e8" font-size="20" font-weight="600">dim-sandbox-runner</text>
    <rect x="680" y="66" width="220" height="100" rx="12" fill="#202b40" stroke="#6b7c9c"/>
    <text x="790" y="96" fill="#a9b6d1" font-size="12" font-weight="600" letter-spacing="1.7">OS BACKEND</text>
    <text x="790" y="132" fill="#e3e9fa" font-size="20" font-weight="600">Platform sandbox</text>
    <rect x="990" y="66" width="210" height="100" rx="12" fill="#202b40" stroke="#6b7c9c"/>
    <text x="1095" y="96" fill="#a9b6d1" font-size="11" font-weight="600" letter-spacing="1.3">RESTRICTED PROCESS</text>
    <text x="1095" y="132" fill="#e3e9fa" font-size="19" font-weight="600">Command + children</text>
    <text x="940" y="227" fill="#8ca5bc" font-size="15">Filesystem + network policy</text>
  </g>
</svg>
